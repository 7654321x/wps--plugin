<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Docxtool 排版</title><style>html,body{max-width:100%;overflow-x:hidden}body{font:14px/1.55 system-ui;margin:0;color:#172033}.pane-toolbar{position:sticky;top:0;display:flex;justify-content:flex-end;padding:8px 12px;background:#fff;border-bottom:1px solid #dce3ee}.pane-content{padding:0 16px 16px}.meta{color:#5c6676;font-size:12px}.panel{border:1px solid #dce3ee;border-radius:8px;padding:12px;margin:12px 0}button{margin:4px;padding:7px 10px;max-width:100%}button.primary{background:#1769aa;color:#fff;border:1px solid #1769aa}.close-pane{background:#fff;color:#b42318;border:1px solid #d92d20;border-radius:5px;font-weight:600}.rows{max-height:245px;overflow:auto}.row{border-top:1px solid #eef1f5;padding:8px 0;overflow-wrap:anywhere}.error{color:#b42318}code{font:12px ui-monospace,monospace}</style><body>
<div class="pane-toolbar"><button id="close-taskpane" class="close-pane" type="button" title="关闭任务窗格" aria-label="关闭任务窗格">关闭任务窗格</button></div><main class="pane-content"><h2>Docxtool 涉密版</h2><p class="meta">版本：<span id="plugin-version">—</span>　构建：<code id="build-id">—</code></p><p id="context-warning" class="error" hidden></p>
<section class="panel"><h3>识别结果</h3><button id="recognize-document">仅识别</button><div id="recognition-summary" class="meta">等待识别。</div><div id="recognition-rows" class="rows"></div></section>
<section class="panel"><h3>排版预览</h3><button id="preview-document">预览排版</button><button id="clear-preview">清除预览</button><div id="preview-summary" class="meta">不会写入格式；空段落不添加批注。</div><div id="preview-rows" class="rows"></div></section>
<section class="panel"><h3>执行状态</h3><button id="format-document" class="primary">一键排版</button><p id="workflow-status">就绪</p><div id="execution-result" class="meta"></div></section>
<section class="panel"><h3>问题与复核</h3><div id="issues" class="meta">暂无问题。</div></section></main>
<script src="build-info.js"></script><script type="module" src="../taskpane-workflow.js"></script></body></html>
