[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docxtool-command-service"
version = "0.1.0"
description = "Pure, declarative command service for the Docxtool WPS add-in"
requires-python = ">=3.8,<3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docxtool_command_service = ["profiles/*.json"]
